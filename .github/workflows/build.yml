name: Build Pawn Tools

on:
  push:
    branches:
      - master
      - perf/completion-optimization
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and package VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/perf/completion-optimization'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh dependency lockfile"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile and test TypeScript
        run: npm test

      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package --out Pawn-Tools.vsix

      - name: Upload standalone VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          path: Pawn-Tools.vsix
          archive: false
          if-no-files-found: error
          retention-days: 1
